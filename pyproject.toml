[project]
name = "system_tables_to_sentinel"
version = "0.0.1"
authors = [{ name = "sergio.schena@databricks.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-identity>=1.24.0",
    "azure-mgmt-loganalytics==13.0.0b6",
    "azure-mgmt-monitor>=7.0.0",
    "azure-monitor-ingestion>=1.1.0",
]

[dependency-groups]
dev = [
    "databricks-dlt",
    "pyspark>=3.5.0",
    "databricks-connect>=16.4,<17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_helpers"]
